name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Lint and type check
        run: bun run check
      - name: Unit tests
        run: bun test src
      - name: Build
        run: bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lighthouse (mobile, built site)
        run: bunx @lhci/cli@0.15.1 autorun --config=lighthouse/ci.json
      - name: Lighthouse summary
        if: always()
        run: test -f lhci-report/manifest.json && bun scripts/lhci-summary.ts >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: lhci-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Smoke test built pages
        run: |
          bunx playwright install --with-deps chromium
          bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results
          retention-days: 7
